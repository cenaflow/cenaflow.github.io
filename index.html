<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/palco-downloads/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Palco — gestão para empresas de som, luz, vídeo e estruturas. Estoque, agenda, orçamentos e financeiro com a marca da sua empresa.">
  <meta name="theme-color" content="#0F6E6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Palco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Palco — gestão de eventos</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // QR do equipamento: /estoque/item/<id>
    // No Android tenta o app (palco://item/<id>). Sem o app, ou fora do
    // Android, abre a mesma ficha na web. App Link verificado pula esta página.
    (function () {
      var match = location.pathname.match(/^(.*?)\/estoque\/item\/([^/]+)\/?$/);
      if (!match) return;
      var id = decodeURIComponent(match[2]);
      var web = location.origin + match[1] + '/#/estoque/item/' + encodeURIComponent(id);
      var android = /Android/i.test(navigator.userAgent || '');
      if (!android) {
        location.replace(web);
        return;
      }
      var intent = 'intent://item/' + encodeURIComponent(id) +
        '#Intent;scheme=palco;package=br.com.palco.palco;S.browser_fallback_url=' +
        encodeURIComponent(web) + ';end';
      location.href = intent;
      setTimeout(function () {
        if (document.visibilityState === 'visible') location.replace(web);
      }, 1500);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
