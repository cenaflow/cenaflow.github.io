<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cenaflow — gestão para empresas de som, luz, vídeo e estruturas. Estoque, agenda, orçamentos e financeiro com a marca da sua empresa.">
  <meta name="theme-color" content="#0A1833">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cenaflow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cenaflow — gestão de eventos</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0A1833; }
    #cf-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 75% -10%, rgba(132,49,242,.35), rgba(251,128,31,.12) 45%, transparent 75%), #0A1833;
      transition: opacity .35s ease; z-index: 9; }
    #cf-splash img { width: 96px; height: auto; animation: cf-pulse 1.6s ease-in-out infinite; }
    #cf-splash .bar { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #8431F2, #FB801F); animation: cf-bar 1.2s ease-in-out infinite; }
    @keyframes cf-pulse { 50% { transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(251,128,31,.45)); } }
    @keyframes cf-bar { 0%,100% { opacity: .35; transform: scaleX(.5); } 50% { opacity: 1; transform: scaleX(1); } }
  </style>
  <script>
    // QR do equipamento: /estoque/item/<id>
    // No Android tenta o app (palco://item/<id>). Sem o app, ou fora do
    // Android, abre a mesma ficha na web. App Link verificado pula esta página.
    (function () {
      var match = location.pathname.match(/^(.*?)\/estoque\/item\/([^/]+)\/?$/);
      if (!match) return;
      var id = decodeURIComponent(match[2]);
      var web = location.origin + match[1] + '/#/estoque/item/' + encodeURIComponent(id);
      var android = /Android/i.test(navigator.userAgent || '');
      if (!android) {
        location.replace(web);
        return;
      }
      var intent = 'intent://item/' + encodeURIComponent(id) +
        '#Intent;scheme=palco;package=br.com.palco.palco;S.browser_fallback_url=' +
        encodeURIComponent(web) + ';end';
      location.href = intent;
      setTimeout(function () {
        if (document.visibilityState === 'visible') location.replace(web);
      }, 1500);
    })();
  </script>
</head>
<body>
  <div id="cf-splash" aria-label="Carregando Cenaflow"><img src="icons/cenaflow-symbol.png" alt="Cenaflow"><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('cf-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
